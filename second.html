<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ура!</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="card">
    <div class="section-emoji">🎉</div>
    <h1 class="title-script">Ура!</h1>
    <div class="divider"><span>♥</span></div>

    <p class="lead" id="gladLead" data-f="Отлично, я очень рад, что ты согласилась 💍" data-m="Отлично, я очень рад, что ты согласился 💍" data-x="Отлично! 💍">Отлично, я очень рад, что ты согласилась 💍</p>
    <p class="lead" id="whenLead" data-f="Когда ты свободна?" data-m="Когда ты свободен?" data-x="Когда будет время?">Когда ты свободна?</p>

    <div class="field-label">📅 Выбери дату</div>
    <input type="date" class="date-input" id="dateInput">

    <div class="field-label">🕐 Выбери время</div>
    <div class="time-list" id="timeList">
      <label class="time-card" data-time="18:00">
        <span class="emoji">🌇</span>
        <span class="text">
          <span class="time">18:00</span>
          <span class="joke">Рановато... давай попозже 😅</span>
        </span>
        <span class="radio"></span>
      </label>
      <label class="time-card" data-time="21:00">
        <span class="emoji">🌃</span>
        <span class="text">
          <span class="time">21:00</span>
          <span class="joke" id="jokeMid" data-f="Как знаешь, конечно, но я бы выбрал попозже 🥲" data-m="Как знаешь, конечно, но я бы выбрал попозже 🥲" data-x="Шикарно, отличное время! 😄">Как знаешь, конечно, но я бы выбрал попозже 🥲</span>
        </span>
        <span class="radio"></span>
      </label>
      <label class="time-card" data-time="23:00">
        <span class="emoji">🌙</span>
        <span class="text">
          <span class="time">23:00</span>
          <span class="joke">Отлично — идеальный выбор! 🔥</span>
        </span>
        <span class="radio"></span>
      </label>
    </div>

    <div class="summary-box" id="summaryBox" style="display:none;"></div>

    <div class="field-label" id="foodLabel" style="margin-top:28px;" data-f="Что бы ты хотела покушать на нашем свидании? 🤤" data-m="Что бы ты хотел покушать на нашем свидании? 🤤" data-x="Что предпочитаем из еды на свидании? 🤤">Что бы ты хотела покушать на нашем свидании? 🤤</div>
    <div class="food-grid" id="foodGrid">
      <div class="food-card" data-food="Пицца"><span class="check">✓</span><span class="emoji">🍕</span><span class="label">Пицца</span></div>
      <div class="food-card" data-food="Паста"><span class="check">✓</span><span class="emoji">🍝</span><span class="label">Паста</span></div>
      <div class="food-card" data-food="Креветки"><span class="check">✓</span><span class="emoji">🦐</span><span class="label">Креветки</span></div>
      <div class="food-card" data-food="Селёдка с пюрешкой"><span class="check">✓</span><span class="emoji">🐟</span><span class="label">Селёдка с пюрешкой</span></div>
      <div class="food-card" data-food="Хамон с сыром и вином"><span class="check">✓</span><span class="emoji">🍷</span><span class="label">Хамон с сыром и вином</span></div>
      <div class="food-card" data-food="Хинкали с хачапури"><span class="check">✓</span><span class="emoji">🥟</span><span class="label">Хинкали с хачапури</span></div>
    </div>

    <div class="field-label" style="margin-top:28px;">➕ Дополнительно</div>
    <div class="food-grid" id="extrasGrid">
      <div class="food-card" data-extra="Кальян"><span class="check">✓</span><span class="emoji">💨</span><span class="label">Кальян</span></div>
      <div class="food-card" data-extra="Ресторан"><span class="check">✓</span><span class="emoji">🍽️</span><span class="label">Ресторан</span></div>
      <div class="food-card" data-extra="Баня"><span class="check">✓</span><span class="emoji">🧖</span><span class="label">Баня</span></div>
      <div class="food-card" data-extra="Массаж"><span class="check">✓</span><span class="emoji">💆</span><span class="label">Массаж</span></div>
    </div>

    <button class="submit-btn" id="submitBtn" disabled>Отправить! 💌</button>
  </div>

  <script src="assets/hearts.js"></script>
  <script>
    const dateInput = document.getElementById('dateInput');
    const timeList = document.getElementById('timeList');
    const summaryBox = document.getElementById('summaryBox');
    const foodGrid = document.getElementById('foodGrid');
    const extrasGrid = document.getElementById('extrasGrid');
    const submitBtn = document.getElementById('submitBtn');

    let selectedTime = null;
    const selectedFood = new Set();
    const selectedExtras = new Set();

    function updateSummary() {
      if (dateInput.value && selectedTime) {
        summaryBox.style.display = 'block';
        summaryBox.textContent = '📅 ' + formatRuDateTime(dateInput.value, selectedTime);
      } else {
        summaryBox.style.display = 'none';
      }
      submitBtn.disabled = !(dateInput.value && selectedTime);
    }

    dateInput.addEventListener('change', updateSummary);

    timeList.querySelectorAll('.time-card').forEach((card) => {
      card.addEventListener('click', () => {
        timeList.querySelectorAll('.time-card').forEach((c) => {
          c.classList.remove('selected');
          c.querySelector('.radio').textContent = '';
        });
        card.classList.add('selected');
        card.querySelector('.radio').textContent = '✓';
        selectedTime = card.dataset.time;
        updateSummary();
      });
    });

    foodGrid.querySelectorAll('.food-card').forEach((card) => {
      card.addEventListener('click', () => {
        const food = card.dataset.food;
        if (selectedFood.has(food)) {
          selectedFood.delete(food);
          card.classList.remove('selected');
        } else {
          selectedFood.add(food);
          card.classList.add('selected');
        }
      });
    });

    extrasGrid.querySelectorAll('.food-card').forEach((card) => {
      card.addEventListener('click', () => {
        const extra = card.dataset.extra;
        if (selectedExtras.has(extra)) {
          selectedExtras.delete(extra);
          card.classList.remove('selected');
        } else {
          selectedExtras.add(extra);
          card.classList.add('selected');
        }
      });
    });

    const pageParams = new URLSearchParams(window.location.search);
    const token = pageParams.get('u');
    const genderParam = pageParams.get('g');
    const gender = genderParam === 'm' ? 'm' : genderParam === 'x' ? 'x' : 'f';

    function applyGenderText(id) {
      const el = document.getElementById(id);
      el.textContent = gender === 'm' ? el.dataset.m : gender === 'x' ? el.dataset.x : el.dataset.f;
    }

    applyGenderText('gladLead');
    applyGenderText('whenLead');
    applyGenderText('jokeMid');
    applyGenderText('foodLabel');

    submitBtn.addEventListener('click', () => {
      if (submitBtn.disabled) return;
      const payload = {
        date: dateInput.value,
        time: selectedTime,
        food: Array.from(selectedFood),
        extras: Array.from(selectedExtras),
        gender
      };
      localStorage.setItem('dateInvite', JSON.stringify(payload));

      if (token) {
        fetch('/api/notify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ u: token, ...payload })
        }).catch(() => {});
      }

      window.location.href = 'third.html';
    });
  </script>
</body>
</html>
